name: Premiere MCP CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  premiere-mcp-check:
    name: Premiere MCP Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          pip install -e apps/premiere/adobe-mcp

      - name: Run Ruff (repo policy from pyproject.toml)
        run: |
          ruff check apps/premiere/adobe-mcp/adobe_mcp

      - name: Compile active Premiere MCP Python
        run: |
          python -m compileall -q apps/premiere/adobe-mcp/adobe_mcp

      - name: Unit tests (plan / layout / verify math)
        run: |
          python -m pytest apps/premiere/adobe-mcp/tests -q

      - name: Syntax-check proxy server
        run: |
          node --check apps/premiere/adobe-mcp/proxy-server/proxy.js
          node --check apps/premiere/adobe-mcp/uxp-plugins/premiere/commands/index.js

  format-check:
    name: Biome Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dev dependencies
        run: bun install --frozen-lockfile

      - name: Biome CI
        run: bun run format:check
