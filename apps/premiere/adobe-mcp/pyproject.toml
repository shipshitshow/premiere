[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adobe-premiere-mcp"
version = "1.0.0"
description = "MCP server for editing inside Adobe Premiere Pro"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "Adobe MCP Contributors"},
]
dependencies = [
    "mcp>=1.1.1,<2",
    "python-socketio>=5.0.0",
    "pillow>=12.3.0",
]

[project.scripts]
adobe-premiere = "adobe_mcp.premiere:main"
adobe-proxy = "adobe_mcp.proxy:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["adobe_mcp"]
